<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#080808;--bg2:#111;--glass:rgba(255,255,255,.045);--line:rgba(255,255,255,.12);--tx:#fff;--mu:#9a9a9f;color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:84px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
section{padding:110px 0;position:relative}
.alt{background:var(--bg2)}
h1,h2,h3{margin:0;line-height:1.08;letter-spacing:-.02em}
h2{font-size:clamp(32px,5vw,56px);font-weight:700;margin-bottom:14px}
.eyebrow{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--mu);margin-bottom:14px}
.lead{color:var(--mu);max-width:620px;font-size:18px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 24px 60px -30px #000}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;border-radius:999px;font-weight:600;font-size:15px;border:1px solid var(--line);cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s;font-family:inherit;color:var(--tx);background:transparent}
.btn:hover{transform:translateY(-2px)}
.btn.p{background:linear-gradient(180deg,#fff,#cfcfd4);color:#0a0a0a;border-color:transparent;box-shadow:0 0 36px rgba(255,255,255,.18)}
.btn.p:hover{box-shadow:0 0 52px rgba(255,255,255,.32)}
.btn.g:hover{background:var(--glass)}
header{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:rgba(8,8,8,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-weight:800;letter-spacing:.22em}
nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0}
nav a{color:var(--mu);font-size:14px;transition:color .2s}nav a:hover{color:#fff}
.right{display:flex;align-items:center;gap:12px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{background:none;border:0;color:var(--mu);font:600 12px inherit;font-family:inherit;padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button.on{background:#fff;color:#000}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:#fff;font-size:20px;cursor:pointer}
.hero{min-height:100vh;display:flex;align-items:center;padding:130px 0 90px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}
.glow{position:absolute;border-radius:50%;filter:blur(110px);background:rgba(255,255,255,.1);pointer-events:none}
h1{font-size:clamp(64px,11vw,150px);font-weight:800;letter-spacing:-.04em;background:linear-gradient(180deg,#fff 30%,#8d8d93);-webkit-background-clip:text;background-clip:text;color:transparent}
.role{letter-spacing:.3em;font-size:13px;color:#cfcfd4;margin:18px 0 22px}
.tag{font-size:clamp(18px,2.2vw,24px);max-width:520px;margin-bottom:18px}
.meta{color:var(--mu);font-size:14px;margin-bottom:32px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.photo{position:relative;justify-self:center;width:min(100%,420px)}
.photo::before{content:"";position:absolute;inset:-14%;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent);filter:blur(30px)}
.frame{position:relative;padding:12px;border-radius:34px;border:1px solid var(--line);background:var(--glass);box-shadow:0 40px 90px -30px #000}
.frame img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;border-radius:24px;filter:grayscale(.15) contrast(1.03)}
.scroll{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);width:24px;height:40px;border:1px solid var(--line);border-radius:14px}
.scroll::after{content:"";position:absolute;left:50%;top:8px;width:3px;height:8px;margin-left:-1.5px;border-radius:3px;background:#fff;animation:sc 1.8s infinite}
@keyframes sc{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
.about{display:grid;grid-template-columns:1.2fr .8fr;gap:50px}
.about p{color:#d6d6da;font-size:18px;margin:0 0 16px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}
.chip{padding:22px}.chip b{display:block;font-size:22px}.chip span{color:var(--mu);font-size:13px}
.grid{display:grid;gap:18px;margin-top:46px}
.g5{grid-template-columns:repeat(3,1fr)}
.card{padding:28px;transition:transform .35s,border-color .35s,box-shadow .35s;display:flex;flex-direction:column;gap:10px}
.card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.3);box-shadow:0 30px 70px -30px rgba(255,255,255,.18)}
.ic{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.06)}
.card h3{font-size:20px}.card p{color:var(--mu);margin:0;font-size:15px;flex:1}
.works{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:46px}
.work{overflow:hidden;transition:box-shadow .4s}
.work:hover{box-shadow:0 0 70px -20px rgba(255,255,255,.28)}
.shot{aspect-ratio:16/10;overflow:hidden;background:#0c0c0c;border-bottom:1px solid var(--line);position:relative}
.shot .in{position:absolute;inset:0;transition:transform .7s}
.work:hover .in{transform:scale(1.06)}
.bar{display:flex;gap:6px;padding:12px 14px}.bar i{width:9px;height:9px;border-radius:50%;background:#3a3a3d}
.mock{position:absolute;inset:36px 0 0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 30%,#2a2a2d,#0b0b0b 70%)}
.mock b{font-size:clamp(30px,5vw,54px);letter-spacing:.08em}.mock small{display:block;letter-spacing:.3em;color:var(--mu);margin-top:8px;font-size:11px}
.wb{padding:26px}.wb .k{color:var(--mu);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.wb h3{font-size:26px;margin:6px 0 10px}.wb p{color:var(--mu);margin:0 0 20px}
.g3{grid-template-columns:repeat(3,1fr)}
.cts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:40px 0}
.ct{padding:20px;text-align:center;transition:transform .3s,border-color .3s}.ct:hover{transform:translateY(-4px);border-color:#fff6}
.ct small{display:block;color:var(--mu);font-size:12px;margin-top:4px;word-break:break-all}
form{padding:34px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.f{display:flex;flex-direction:column;gap:6px}.f.w{grid-column:1/-1}
label{font-size:13px;color:#cfcfd4}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;color:#fff;padding:14px 16px;font:16px inherit;font-family:inherit;outline:0;transition:border-color .2s,box-shadow .2s}
select option{background:#111}
input:focus,select:focus,textarea:focus{border-color:#fff9;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
textarea{min-height:120px;resize:vertical}
.err{color:#ff8f8f;font-size:12.5px;min-height:0}.bad{border-color:#ff8f8f!important}
.ok{display:none;padding:40px;text-align:center}.ok h3{font-size:28px;margin:10px 0}.ok p{color:var(--mu);max-width:480px;margin:0 auto 18px}
footer{padding:36px 0;border-top:1px solid var(--line);color:var(--mu);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s ease}.rv.in{opacity:1;transform:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;padding:12px 20px;border-radius:999px;z-index:99;transition:.3s;pointer-events:none;font-size:14px;background:rgba(20,20,20,.9);border:1px solid var(--line)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){
 section{padding:80px 0}
 .burger{display:block}
 nav{position:absolute;top:100%;left:12px;right:12px;margin-top:8px;padding:12px;border-radius:20px;border:1px solid var(--line);background:rgba(14,14,14,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:none}
 nav.open{display:block}nav ul{flex-direction:column;gap:0}nav a{display:block;padding:14px;font-size:16px}
 .hero .wrap,.about,.works{grid-template-columns:1fr}
 .photo{order:-1;width:min(78%,320px)}
 .g5,.g3{grid-template-columns:1fr 1fr}.cts{grid-template-columns:1fr 1fr}
 .scroll{display:none}
}
@media(max-width:600px){.g5,.g3,form{grid-template-columns:1fr}.wrap{padding:0 18px}.btn{width:100%}.cta{flex-direction:column}.chips{grid-template-columns:1fr 1fr}form{padding:22px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}

/* ===== PREMIUM REDESIGN ===== */
:root{--dk:#08090B;--gr:#17191D;--ch:#25282D;--ww:#F5F4F0;--sg:#E8E8E5;--bg:#08090B;--mu:#85878C;--be:#C7BDAE}
section{overflow:hidden}.wrap{position:relative;z-index:1}
section::before{content:"";position:absolute;left:0;right:0;top:-1px;height:140px;background:linear-gradient(var(--prev,transparent),transparent);pointer-events:none;z-index:0}
#about{--prev:#101215;background:var(--ww)}#skills{--prev:var(--ww);background:radial-gradient(circle,rgba(23,25,29,.07) 1px,transparent 1.5px) 0 0/26px 26px,var(--sg)}
#works{--prev:var(--sg);background:radial-gradient(800px at 90% 0,rgba(255,255,255,.06),transparent),#111316}
#services{--prev:#111316;background:linear-gradient(180deg,#fff,#EDECE8)}
#contact{--prev:#EDECE8;background:radial-gradient(600px at 88% 8%,rgba(255,255,255,.09),transparent),radial-gradient(520px at 8% 92%,rgba(199,189,174,.12),transparent),var(--gr)}
footer{background:var(--dk)}
.dec{position:absolute;right:-180px;top:12%;width:520px;height:520px;border-radius:50%;border:1px solid rgba(23,25,29,.13);pointer-events:none}
.dec::after{content:"";position:absolute;inset:60px;border-radius:50%;border:1px solid rgba(23,25,29,.09)}
.dec.dk{border-color:rgba(255,255,255,.1);background:radial-gradient(closest-side,rgba(255,255,255,.05),transparent)}.dec.dk::after{border-color:rgba(255,255,255,.07)}
/* hero */
.hero{background:radial-gradient(900px 600px at 15% 0,var(--ch),transparent 65%),#101215}
.hero::before{content:"";position:absolute;right:6%;top:8%;width:50%;aspect-ratio:1;background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent);filter:blur(30px);animation:breathe 7s ease-in-out infinite;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.b1{width:380px;height:380px;left:6%;bottom:6%;background:rgba(255,255,255,.1);animation:drift 16s ease-in-out infinite alternate}
.b2{width:300px;height:300px;left:42%;top:4%;background:rgba(199,189,174,.14);animation:drift 21s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(70px,-50px) scale(1.15)}}@keyframes breathe{50%{opacity:.55;transform:scale(1.08)}}
.hero h1.in{animation:trk 1.5s cubic-bezier(.2,.7,.2,1) backwards}@keyframes trk{from{letter-spacing:.14em;filter:blur(8px)}}
.hc>.rv:nth-child(1){transition-delay:.05s}.hc>.rv:nth-child(2){transition-delay:.2s}.hc>.rv:nth-child(3){transition-delay:.35s}.hc>.rv:nth-child(4){transition-delay:.5s}.hc>.rv:nth-child(5){transition-delay:.65s}
/* reveal variants */
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}.w>span{display:inline-block;transform:translateY(110%);transition:transform .9s cubic-bezier(.2,.7,.2,1)}.in .w>span{transform:none}
.fl{transform:translateX(-50px)}.fr{transform:translateX(50px)}
.st{opacity:0}.st.in{opacity:1;animation:up .8s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*100ms)}
@keyframes up{from{opacity:0;transform:translateY(34px)}}@keyframes pop{from{opacity:0;transform:scale(.88) rotate(-2deg)}}@keyframes rise{from{opacity:0;transform:translateY(80px) scale(.96)}}@keyframes blurin{from{opacity:0;filter:blur(12px);transform:translateY(16px)}}
#skills .st.in{animation-name:pop}#works .st.in{animation-name:rise;animation-duration:1s}#contact .st.in{animation-name:blurin}
/* light surfaces */
.lt{color:#0c0d0f}.lt h2{color:#0c0d0f}.lt .eyebrow{color:var(--mu)}.lt .lead,.lt .card p,.lt .chip span{color:#55585e}.lt .about p{color:#2a2c30}
.lt .glass{background:rgba(255,255,255,.72);border-color:rgba(23,25,29,.09);box-shadow:0 18px 40px -24px rgba(23,25,29,.4)}
.lt .ic{background:var(--gr);color:var(--ww);border:0;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.lt .card:hover,.lt .chip:hover{border-color:rgba(23,25,29,.3);box-shadow:0 32px 60px -26px rgba(23,25,29,.45),0 0 0 4px rgba(255,255,255,.7)}
.lt .btn.g{color:var(--gr);border-color:rgba(23,25,29,.25)}
#about h2{font-size:clamp(38px,6vw,78px)}#about .eyebrow::after{content:"";display:block;width:56px;height:1px;background:var(--gr);margin-top:12px}
.chip{transition:transform .4s,box-shadow .4s}.chip:hover{transform:translateY(-6px)}
/* skills: different cards */
#skillGrid{grid-template-columns:repeat(6,1fr)}#skillGrid>:nth-child(-n+2){grid-column:span 3}#skillGrid>:nth-child(n+3){grid-column:span 2}
#skillGrid>:nth-child(2) .ic{border-radius:50%}#skillGrid>:nth-child(3) .ic{border-radius:6px}#skillGrid>:nth-child(4) .ic{background:var(--be);color:var(--gr)}#skillGrid>:nth-child(5) .ic{transform:rotate(45deg);border-radius:10px}
#skillGrid>:nth-child(1){border-top:3px solid var(--gr)}#skillGrid>:nth-child(3){border-bottom:3px solid var(--be)}#skillGrid>:nth-child(4){background:rgba(199,189,174,.22)}
#skillGrid .card:hover{transform:translateY(-6px) scale(1.03)}#skillGrid .card:hover .ic{transform:rotate(-10deg) scale(1.15)}
/* works */
.work{position:relative;transition:transform .25s ease-out,box-shadow .4s,border-color .4s}.work:hover{border-color:rgba(255,255,255,.3)}
.work::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.13),transparent 45%);opacity:0;transition:opacity .4s;pointer-events:none;z-index:2}.work:hover::before{opacity:1}
.shot{aspect-ratio:16/11}.shot img{position:absolute;inset:36px 0 0;width:100%;height:calc(100% - 36px);object-fit:cover;object-position:top}
.mock.m-barin{background:linear-gradient(135deg,#2b2620,#0d0c0b 72%)}.mock.m-prime{background:linear-gradient(135deg,#2a2d33,#0c0d0f 72%)}
.mn{position:absolute;top:0;left:0;right:0;height:40px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid rgba(255,255,255,.07)}
.mn i{width:34px;height:4px;border-radius:4px;background:rgba(255,255,255,.25)}.mn em{margin-left:auto;width:60px;height:18px;border-radius:99px;border:1px solid rgba(255,255,255,.3)}
.mock u{display:block;width:120px;height:30px;margin:20px auto 0;border-radius:99px;background:var(--be)}.m-prime u{background:var(--sg)}
/* services */
#svcGrid .card:hover{transform:translateY(-8px)}#svcGrid .card:hover .ic{transform:translateY(-5px) rotate(10deg)}
/* buttons */
.btn{position:relative;overflow:hidden;z-index:0}.btn.g::before{content:"";position:absolute;inset:0;background:currentColor;opacity:.12;transform:translateY(101%);transition:transform .4s;z-index:-1}.btn.g:hover::before{transform:none}
.btn b{transition:transform .3s}.btn:hover b{transform:translateX(4px)}
form .btn.p{animation:pulse 3.2s infinite}@keyframes pulse{50%{box-shadow:0 0 56px rgba(255,255,255,.36)}}
/* nav + contact */
header{transition:background .4s,border-color .4s}header.sc{background:rgba(8,9,11,.82)}
nav ul{gap:6px}nav a{padding:8px 14px;border-radius:999px;transition:color .2s,background .2s}nav a.act{color:#fff;background:rgba(255,255,255,.1)}
.glow{animation:drift 14s ease-in-out infinite alternate}
#contact .glass{background:rgba(255,255,255,.05);box-shadow:0 40px 90px -40px #000}
input:focus,select:focus,textarea:focus{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.1),0 0 28px rgba(255,255,255,.18)}
@media(max-width:900px){#skillGrid{grid-template-columns:1fr 1fr}#skillGrid>*{grid-column:auto!important}.dec{display:none}nav a.act{background:rgba(255,255,255,.08)}}
